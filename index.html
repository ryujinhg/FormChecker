<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FormChecker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
    }
    .video-container {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .controls-panel {
      width: 100%;
      max-width: 500px;
      background: #1e1e1e;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 50vh;
      overflow-y: auto;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .setting-label {
      font-size: 14px;
      color: #ccc;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-step {
      background: #333;
      color: #fff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-step:active {
      background: #555;
    }
    .value-display {
      font-size: 16px;
      min-width: 60px;
      text-align: center;
    }
    .main-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #007aff;
      color: #fff;
    }
    .main-btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <div class="controls-panel">
    <!-- カメラを起動ボタン（一番上） -->
    <button id="startBtn" class="main-btn" onclick="startCamera()">カメラを起動</button>

    <!-- 録画時間設定（0.1秒刻み） -->
    <div class="setting-row">
      <span class="setting-label">録画時間</span>
      <div class="stepper">
        <button class="btn-step" onclick="adjustSetting('record', -0.1)">-</button>
        <span id="recVal" class="value-display">3.0 秒</span>
        <button class="btn-step" onclick="adjustSetting('record', 0.1)">+</button>
      </div>
    </div>

    <!-- 移動待機時間設定 -->
    <div class="setting-row">
      <span class="setting-label">移動待機時間</span>
      <div class="stepper">
        <button class="btn-step" onclick="adjustSetting('move', -0.5)">-</button>
        <span id="moveVal" class="value-display">2.0 秒</span>
        <button class="btn-step" onclick="adjustSetting('move', 0.5)">+</button>
      </div>
    </div>

    <!-- 再生速度設定（最大1.0倍） -->
    <div class="setting-row">
      <span class="setting-label">再生速度</span>
      <div class="stepper">
        <button class="btn-step" onclick="adjustSetting('speed', -1)">-</button>
        <span id="speedVal" class="value-display">1.0x</span>
        <button class="btn-step" onclick="adjustSetting('speed', 1)">+</button>
      </div>
    </div>

    <!-- 検知感度設定 -->
    <div class="setting-row">
      <span class="setting-label">検知感度</span>
      <div class="stepper">
        <button class="btn-step" onclick="adjustSetting('sensitivity', -0.01)">-</button>
        <span id="sensitivityVal" class="value-display">0.15</span>
        <button class="btn-step" onclick="adjustSetting('sensitivity', 0.01)">+</button>
      </div>
    </div>
  </div>

  <script>
    // --- 変数管理 ---
    let recordDuration = 3.0;
    let moveDelay = 2.0;
    // 再生速度は最大1.0倍限定
    const speedOptions = [0.25, 0.5, 0.75, 1.0];
    let speedIndex = 3; // 初期値: 1.0x
    let motionThreshold = 0.15;

    // --- UI表示の初期化 ---
    function initUIValues() {
      const recEl = document.getElementById('recVal');
      const moveEl = document.getElementById('moveVal');
      const speedEl = document.getElementById('speedVal');
      const sensEl = document.getElementById('sensitivityVal');

      if (recEl) recEl.innerText = recordDuration.toFixed(1) + ' 秒';
      if (moveEl) moveEl.innerText = moveDelay.toFixed(1) + ' 秒';
      if (speedEl) speedEl.innerText = speedOptions[speedIndex] + 'x';
      if (sensEl) sensEl.innerText = motionThreshold.toFixed(2);
    }

    // DOM構築完了後に初期化を実行
    window.addEventListener('DOMContentLoaded', () => {
      initUIValues();
    });

    // --- 設定値の調整 ---
    function adjustSetting(type, delta) {
      if (type === 'record') {
        // 0.1秒単位の計算誤差対策
        recordDuration = Math.max(0.1, Math.round((recordDuration + delta) * 10) / 10);
      } else if (type === 'move') {
        moveDelay = Math.max(0.0, moveDelay + delta);
      } else if (type === 'speed') {
        speedIndex = Math.max(0, Math.min(speedOptions.length - 1, speedIndex + delta));
      } else if (type === 'sensitivity') {
        motionThreshold = Math.max(0.01, Math.min(1.00, Math.round((motionThreshold + delta) * 100) / 100));
      }
      initUIValues();
    }

    // --- カメラの起動処理 ---
    async function startCamera() {
      const video = document.getElementById('webcam');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        console.error('カメラの起動に失敗しました:', err);
        alert('カメラの起動に失敗しました。');
      }
    }

    // PWA Service Workerの登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(err => {
          console.log('SW registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
